[pytest]
# Gate A Recovery Integration Tests Configuration
# PostgreSQL Real Database Required

testpaths = backend/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Environment: Use PostgreSQL real (neoeve_recovery_test)
# Set TEST_DATABASE_URL environment variable before running:
# export TEST_DATABASE_URL=postgresql://recovery_test_user:recovery_test_pass_7XqR9kL2mN4@localhost:5433/neoeve_recovery_test

markers =
    gate_a: Gate A Recovery integration tests
    postgresql: Tests requiring PostgreSQL real database
    concurrency: Concurrency and isolation tests
    recovery: Recovery mechanism tests

addopts = -v --tb=short -ra
